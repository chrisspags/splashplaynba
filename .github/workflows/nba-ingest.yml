# Installed once as splashplaynba/.github/workflows/nba-ingest.yml; started only from the admin page, no schedule.
name: nba-ingest
on:
  repository_dispatch:
    types: [nba-ingest]
permissions:
  contents: write
  # Order 072: the minutes Chris typed are private. The projection step asks the site for them (nba-typed-for-job.js) with the identity
  # token GitHub signs for this run, so the list never sits in this public repo, its inputs, its log or its cache.
  id-token: write
concurrency:
  group: nba-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEASON: ${{ github.event.client_payload.season }}
      SUMS_SHA256: ${{ github.event.client_payload.sums_sha256 }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the request and every script
        run: |
          set -eu
          printf '%s' "$SEASON" | grep -Eq '^[0-9]{4}-[0-9]{2}$' || { echo "::error::season must look like 2026-27"; exit 1; }
          printf '%s' "$SUMS_SHA256" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::script checksum missing"; exit 1; }
          echo "$SUMS_SHA256  tools/nba-ingest/SHA256SUMS" | sha256sum -c -
          (cd tools/nba-ingest && sha256sum -c SHA256SUMS)
          echo ".nba-cache/" >> .git/info/exclude
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Orders 078/081: the projection step runs its chain check (nba_chain_check.js, under node) on each date's file before it is
      # published; with no node it publishes no file. Pinned by commit like the other actions; node 20, as the release gate runs it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nba-cache
          key: nba-cache-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: nba-cache-${{ env.SEASON }}-
      # The projection step's one dependency, pinned to the version it was reviewed on, by the hash PyPI publishes for this wheel.
      # If it cannot be installed the run goes on: the projection step says so in the status file and the history is still written.
      - name: Install numpy, pinned
        run: |
          printf '%s\n' 'numpy==2.3.5 --hash=sha256:0d8163f43acde9a73c2a33605353a4f1bc4798745a8b1d73183b28e5b435ae28' > "$RUNNER_TEMP/nba-requirements.txt"
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/nba-requirements.txt" || echo "::warning::numpy 2.3.5 could not be installed; the projection step will report it"
      - name: Ingest
        env:
          NBA_TYPED_URL: https://splashplaypodcast.com/.netlify/functions/nba-typed-for-job
        run: python3 tools/nba-ingest/run.py --season "$SEASON" --cache .nba-cache --out . --outputs-file "$RUNNER_TEMP/nba-outputs.txt"
      - name: Commit only the declared outputs
        run: |
          set -eu
          while IFS= read -r p; do
            case "$p" in ""|/*|*..*|.github*|tools*|.nba-cache*) echo "::error::refusing output path '$p'"; exit 1;; esac
            if [ -e "$p" ] || git ls-files --error-unmatch -- "$p" >/dev/null 2>&1; then git add -A -- "$p"; fi
          done < "$RUNNER_TEMP/nba-outputs.txt"
          extra="$(git status --porcelain --untracked-files=all | grep -v '^[MADRC] ' || true)"
          if [ -n "$extra" ]; then echo "::error::changes outside the declared outputs:"; echo "$extra"; exit 1; fi
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git config user.name "splashplay-nba-ingest"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "NBA ingest $SEASON"
          for i in 1 2 3; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            sleep 5
          done
          echo "::error::could not push the ingest commit"; exit 1
